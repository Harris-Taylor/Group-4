version: '3'
services:
  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: example

  db:
    build: db/.
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: example
    ports:
      - "33060:3306"
    volumes:
      - ./db/test_db:/docker-entrypoint-initdb.d