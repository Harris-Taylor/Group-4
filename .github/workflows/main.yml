name: DevOps Workflow
on:
  push:
    branches:
      - master
      - lab08
      - develop

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests with JaCoCo
        run: mvn -B clean test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and Start Database Container
        run: |
          docker build -t database ./db
          docker run -d --name employees -p 33060:3306 database
          echo "Waiting for database to start..."
          sleep 30

      - name: Run Integration Tests
        run: mvn -B -Dtest=com.napier.devops.AppIntegrationTest test

      - name: Stop and Remove Database Container
        if: always()
        run: |
          docker stop employees || true
          docker rm employees || true
          docker image rm database || true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          # hello token: ${{ secrets.CODECOV_TOKEN }} # not needed for public repos
          directory: ./target/site/jacoco
          flags: IntegrationTests
          verbose: true

  Build:
    name: Build and Run with Docker Compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package Application
        run: mvn -B package -DskipTests

      - name: Run docker compose
        run: docker compose up --abort-on-container-exit